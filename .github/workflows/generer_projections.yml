name: Générer projections climatiques 2025-2055

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Générer projections journalières
        run: python3 scripts/generer_projections.py

      - name: Commit et push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git fetch origin main
          git rebase origin/main
          git add dashboard/data/projections/
          git diff --cached --quiet || git commit -m "Mise a jour projections 2025-2055"
          for i in 1 2 3; do
            git push origin main && break
            echo "Retry $i..."
            git fetch origin main
            git rebase origin/main
            sleep 5
          done
