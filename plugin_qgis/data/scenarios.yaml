scenarios:
  optimiste:
    label: "Optimiste (Risques faibles)"
    inondation_factor: 0.5
    secheresse_factor: 0.3
    erosion_factor: 0.4
    description: "Scénario positif avec mesures d'adaptation efficaces"
  
  moyen:
    label: "Moyen (Risques modérés)"
    inondation_factor: 1.0
    secheresse_factor: 1.0
    erosion_factor: 1.0
    description: "Scénario de référence avec adaptation partielle"
  
  pessimiste:
    label: "Pessimiste (Risques élevés)"
    inondation_factor: 1.5
    secheresse_factor: 1.8
    erosion_factor: 2.0
    description: "Scénario critique avec peu d'adaptation"

